version: 2
updates:
  - package-ecosystem: npm
    directories:
      - "/"
      - "/apps/server"
      - "/apps/web"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      production:
        dependency-type: production
      development:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
